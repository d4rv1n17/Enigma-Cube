# Builds EnigmaCube-Setup-<version>.exe on GitHub's Windows machines.
# Open the "Actions" tab and download the installer from the "EnigmaCube-Setup"
# artifact. Every push to main whose version (enigma_timer/__init__.py) has no
# release yet publishes a GitHub Release v<version> with the installer attached.
name: Build Windows installer

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        run: python tools/run_tests.py
      - name: Do not show Windows error dialogs (they would hang the job)
        shell: pwsh
        run: |
          New-Item -Force -Path "HKCU:\Software\Microsoft\Windows\Windows Error Reporting" | Out-Null
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\Windows Error Reporting" -Name DontShowUI -Value 1 -Type DWord
      - name: GUI self-test (source)
        timeout-minutes: 5
        run: python main.py --selftest screenshots
      - name: Build installer
        run: python installer/build.py
      - name: GUI self-test (built exe)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\EnigmaCube\EnigmaCube.exe" -ArgumentList "--selftest", "$PWD\screenshots_exe" -WindowStyle Hidden -PassThru
          $null = $p.Handle  # needed so that ExitCode is available later
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; "self-test timed out"; Get-Content screenshots_exe\steps.txt -ErrorAction SilentlyContinue; exit 1 }
          Get-Content screenshots_exe\steps.txt -Tail 3 -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Get-Content screenshots_exe\error.txt, screenshots_exe\fault.txt -ErrorAction SilentlyContinue; exit 1 }
      - name: Upgrade unregistered 3.1, preserve user data, run and uninstall
        timeout-minutes: 8
        shell: pwsh
        run: |
          # Dependent product installers require a verified supported Hub first.
          $hubRelease = Invoke-RestMethod 'https://api.github.com/repos/d4rv1n17/Enigma-Hub/releases/latest'
          if ([version]$hubRelease.tag_name.TrimStart('v') -lt [version]'1.3.0') { throw 'Enigma Hub 1.3.0 must be published first' }
          $hubAsset = $hubRelease.assets | Where-Object name -eq 'EnigmaHubSetup.exe' | Select-Object -First 1
          if ($hubAsset.digest -notmatch '^sha256:[0-9a-f]{64}$' -or $hubAsset.browser_download_url -notlike 'https://github.com/d4rv1n17/Enigma-Hub/releases/download/*/EnigmaHubSetup.exe') { throw 'Unverified Hub asset' }
          $hubSetup = Join-Path $env:RUNNER_TEMP 'EnigmaHubSetup.exe'
          Invoke-WebRequest $hubAsset.browser_download_url -OutFile $hubSetup
          if ((Get-FileHash -LiteralPath $hubSetup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hubAsset.digest.Substring(7)) { throw 'Hub checksum mismatch' }
          $hubProcess = Start-Process -FilePath $hubSetup -ArgumentList '--quiet' -WindowStyle Hidden -PassThru -Wait
          if ($hubProcess.ExitCode -ne 0) { throw 'Hub installation failed' }
          $setup = (Get-ChildItem Output\EnigmaCube-Setup-*.exe | Select-Object -First 1).FullName
          $dir = Join-Path $env:RUNNER_TEMP "Enigma Cube"
          $release = Invoke-RestMethod "https://api.github.com/repos/${{ github.repository }}/releases/tags/v3.1"
          $asset = $release.assets | Where-Object name -eq "EnigmaCube-Setup-3.1.exe" | Select-Object -First 1
          if (-not $asset -or $asset.digest -notmatch '^sha256:[0-9a-f]{64}$') { throw "Verified 3.1 installer unavailable" }
          $oldSetup = Join-Path $env:RUNNER_TEMP "EnigmaCube-Setup-3.1.exe"
          Invoke-WebRequest $asset.browser_download_url -OutFile $oldSetup
          if ((Get-FileHash -LiteralPath $oldSetup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $asset.digest.Substring(7)) { throw "3.1 installer checksum mismatch" }
          $old = Start-Process -FilePath $oldSetup -ArgumentList "--quiet", "--dir", "`"$dir`"" -WindowStyle Hidden -PassThru
          $null = $old.Handle
          if (-not $old.WaitForExit(240000) -or $old.ExitCode -ne 0) { throw "Installing 3.1 failed" }
          if (-not (Test-Path (Join-Path $dir "EnigmaCube.exe"))) { throw "3.1 app missing" }
          $dataDir = Join-Path $env:APPDATA "EnigmaTimer"
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $data = Join-Path $dataDir "data.json"
          $fixture = @{version=2; settings=@{language="ru";welcome_seen=$true;startup_intro=$false}; training=@{upgrade_check=@{learned=$true}}; current="upgrade-check"; sessions=@(@{id="upgrade-check";name="Upgrade test";puzzle="333";solves=@(@{ms=12340;p=2;s="R U R'";d=1700000000;c="keep this note"})})} | ConvertTo-Json -Depth 10
          [IO.File]::WriteAllText($data, $fixture, [Text.UTF8Encoding]::new($false))
          $dataHash = (Get-FileHash -LiteralPath $data -Algorithm SHA256).Hash
          $note = Join-Path $dir "user-notes.txt"
          [IO.File]::WriteAllText($note, "keep this user file")
          $oldRegistration = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\EnigmaCube"
          if ($oldRegistration.InstallLocation -ne $dir) { throw "Unexpected 3.1 registration path" }
          [Microsoft.Win32.Registry]::CurrentUser.DeleteSubKey("Software\Microsoft\Windows\CurrentVersion\Uninstall\EnigmaCube")
          $p = Start-Process -FilePath $setup -ArgumentList "--quiet", "--dir", "`"$dir`"" -WindowStyle Hidden -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force; "setup timed out"; exit 1 }
          if ($p.ExitCode -ne 0) { "setup exit code $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path (Join-Path $dir "EnigmaCube.exe"))) { "EnigmaCube.exe was not installed"; exit 1 }
          if ((Get-FileHash -LiteralPath $data -Algorithm SHA256).Hash -ne $dataHash) { throw "Upgrade changed user data" }
          if ([IO.File]::ReadAllText($note) -ne "keep this user file") { throw "Upgrade removed user files" }
          $registered = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\EnigmaCube"
          $expected = python -c "from enigma_timer import VERSION; print(VERSION)"
          if ($registered.DisplayVersion -ne $expected -or $registered.InstallLocation -ne $dir) { throw "Upgrade registered a different installation" }
          "installed: $((Get-ChildItem $dir -Recurse | Measure-Object).Count) files"
          $app = Join-Path $dir "EnigmaCube.exe"
          $shots = Join-Path $PWD "screenshots_installed"
          $p = Start-Process -FilePath $app -ArgumentList "--selftest", "`"$shots`"" -WindowStyle Hidden -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; "installed app timed out"; exit 1 }
          if ($p.ExitCode -ne 0) { "installed app self-test failed"; exit 1 }
          if ((Get-FileHash -LiteralPath $data -Algorithm SHA256).Hash -ne $dataHash) { throw "Self-test modified existing user data" }
          $p = Start-Process -FilePath $app -ArgumentList "--uninstall", "--quiet" -WindowStyle Hidden -PassThru
          $null = $p.WaitForExit(60000)
          for ($i = 0; $i -lt 60 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $app) { "uninstall did not remove the app"; exit 1 }
          if ((Get-FileHash -LiteralPath $data -Algorithm SHA256).Hash -ne $dataHash) { throw "Uninstall removed retained user data" }
          "upgrade 3.1 / preserve data / run / uninstall OK"
      - name: Size report
        shell: pwsh
        run: |
          Get-ChildItem Output\*.exe | ForEach-Object { "{0}: {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          "{0:N1} MB app folder" -f ((Get-ChildItem dist\EnigmaCube -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          Get-ChildItem Output\*.exe | ForEach-Object { "{0:N1}" -f ($_.Length / 1MB) } | Out-File -Encoding ascii screenshots\setup_size_mb.txt
      - name: Publish screenshots to the ci-screenshots branch
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "shots"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item screenshots\* $d -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Join-Path $d "exe") | Out-Null
          Copy-Item screenshots_exe\* (Join-Path $d "exe") -ErrorAction SilentlyContinue
          Set-Location $d
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "CI screenshots for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:ci-screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: EnigmaCube-Setup
          path: Output/*.exe
      - name: Prepare release
        id: rel
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = python -c "import enigma_timer; print(enigma_timer.VERSION)"
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0 -and -not "${{ github.ref }}".StartsWith("refs/tags/")) {
            "Release v$v already exists"
            "publish=0" >> $env:GITHUB_OUTPUT
          } else {
            "publish=1" >> $env:GITHUB_OUTPUT
          }
          python installer/release_notes.py $v > release_notes.md
          $global:LASTEXITCODE = 0
      - name: Publish GitHub release
        if: steps.rel.outputs.publish == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Enigma Cube ${{ steps.rel.outputs.version }}
          body_path: release_notes.md
          files: Output/*.exe
          make_latest: true
